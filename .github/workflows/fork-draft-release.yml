name: fork-draft-release

# Keeps one draft release on this fork up to date as PRs merge to main. The
# draft carries the next version (from PR labels) and the release notes.
# Publishing the draft is the release: fork-release.yml builds and attaches the
# binaries. See docs/fork-releasing.md.
#
# Fork-only file; upstream has none by this name, so a sync never conflicts.
on:
  push:
    branches:
      - main
  # Run it on main to regenerate the draft by hand, for example after relabelling
  # a merged PR.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-draft-release
  cancel-in-progress: false

env:
  # release-drafter drafts v0.0.1 (and "No changes") when there is no previous
  # published release. The fork's first release is this version instead; its
  # notes are written by hand, so see the first-release step below.
  FORK_FIRST_VERSION: "0.1.0"

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve first release
        id: first
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          releases="$(gh release list --limit 200 --json tagName,isDraft,isPrerelease)"
          # Prereleases are not a baseline for release-drafter, and the update
          # channel manifest lives on a "channels" prerelease.
          published="$(jq '[.[] | select((.isDraft | not) and (.isPrerelease | not))] | length' <<<"$releases")"
          drafts="$(jq '[.[] | select(.isDraft)] | length' <<<"$releases")"
          if [ "$published" != "0" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$drafts" != "0" ]; then
            # First release, draft already there. With no published release
            # release-drafter has no baseline, so it would replace the
            # hand-written notes with "No changes". Leave the draft alone.
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "First release: leaving the existing draft and its notes untouched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "version=${FORK_FIRST_VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "First release: creating a placeholder draft for v${FORK_FIRST_VERSION}; write its notes by hand." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: release-drafter/release-drafter@v7
        if: ${{ steps.first.outputs.skip != 'true' }}
        with:
          config-name: fork-release-drafter.yml
          version: ${{ steps.first.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
