name: fork-pr-release-label

# Every PR needs a label that fork-release-drafter.yml can turn into a version
# bump, so the draft release always resolves. The autolabeler derives it from
# the conventional commit PR title (feat, fix, docs, chore, ...) and from the
# title or branch of an upstream sync, so most PRs need no manual labelling.
# See docs/fork-releasing.md.
#
# Fork-only file; upstream has none by this name, so a sync never conflicts.
on:
  # pull_request_target (not pull_request) so the autolabeler has a writable
  # token on PRs from forks too. This workflow never checks out or runs PR code.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  autolabel:
    name: Auto-label from release-drafter config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: fork-release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  require-release-label:
    name: Require a version-resolvable label
    needs: autolabel
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          # Keep in sync with the categories in .github/fork-release-drafter.yml.
          # documentation and upstream-sync are here on purpose: a docs-only PR
          # or an upstream sync still needs a label, and both are patch-level.
          labels: >-
            major, breaking-change,
            minor, new-feature, enhancement, performance,
            patch, bugfix, chore, ci, dependencies, documentation, maintenance,
            refactor, upstream-sync
